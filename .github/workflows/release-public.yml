name: Release Public Download

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'New tag matching package.json (example v1.0.1). Blank uses package version.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-public
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate version and release key
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const {version} = JSON.parse(fs.readFileSync('package.json','utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Stable x.y.z required');
          const input = (process.env.INPUT_TAG || '').trim();
          const tag = process.env.GITHUB_EVENT_NAME === 'push' ? process.env.GITHUB_REF_NAME : input ? `v${input.replace(/^v/, '')}` : `v${version}`;
          if (tag !== `v${version}`) throw new Error(`Tag đang chạy là ${tag}, nhưng package.json là ${version}. Tăng version và commit/push trước, hoặc để trống tag khi Run workflow. Tag cần khớp: v${version}`);
          const payload = Buffer.from('xom-update-key-check');
          if (!crypto.verify(null,payload,fs.readFileSync('assets/update-public.pem'),crypto.sign(null,payload,process.env.UPDATE_SIGNING_PRIVATE_KEY))) throw new Error('UPDATE_SIGNING_PRIVATE_KEY does not match public key');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`tag=${tag}\n`);
          JS
      - name: Verify existing tag points to this source
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$TAG^{commit}")" = "$GITHUB_SHA" || { echo 'Existing tag points to different source; use a new version'; exit 1; }
          fi
      - name: Reject an already published version
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > /tmp/existing.json 2>/dev/null; then
            node -e "if(!require('/tmp/existing.json').isDraft) throw new Error('Version already public; increase version instead of overwriting')"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest
            platform: darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:updater
      - name: Build app
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_WORKSPACE_DOMAIN: ${{ vars.GOOGLE_WORKSPACE_DOMAIN }}
          CLOSURE_SHEET_URL: ${{ vars.CLOSURE_SHEET_URL }}
          ANIMATION_NOTES_SHEET_URL: ${{ vars.ANIMATION_NOTES_SHEET_URL }}
        run: |
          if [ '${{ matrix.platform }}' = win32 ]; then
            npm run make:win -- --arch=${{ matrix.arch }}
          else
            npm run make:zip -- --arch=${{ matrix.arch }}
          fi
      - name: Create Windows portable ZIP
        if: matrix.platform == 'win32'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Force -Path out/update-release | Out-Null
          $Packaged = Get-ChildItem out -Directory | Where-Object { $_.Name -like '*win32-x64' } | Select-Object -First 1
          if (-not $Packaged) { throw 'Packaged app missing' }
          Compress-Archive -Path (Join-Path $Packaged.FullName '*') -DestinationPath "out/update-release/Xom-Nha-La-portable-$env:RELEASE_TAG.zip"
          Copy-Item out/make/squirrel.windows/x64/XomNhaLaSetup.exe out/update-release/
      - name: Name macOS ZIP
        if: matrix.platform == 'darwin'
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir -p out/update-release
          ARCHIVE="$(find out/make/zip/darwin -name '*.zip' -type f -print -quit)"
          test -n "$ARCHIVE"
          cp "$ARCHIVE" "out/update-release/Xom-Nha-La-macOS-${{ matrix.arch }}-${RELEASE_TAG}.zip"
      - name: Sign update manifest
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if [ '${{ matrix.platform }}' = win32 ]; then
            ARCHIVE="out/update-release/Xom-Nha-La-portable-${RELEASE_TAG}.zip"
          else
            ARCHIVE="out/update-release/Xom-Nha-La-macOS-${{ matrix.arch }}-${RELEASE_TAG}.zip"
          fi
          node scripts/sign-update.mjs "$ARCHIVE" '${{ matrix.platform }}' '${{ matrix.arch }}' out/update-release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/update-release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/verify-release.mjs release-assets
      - name: Publish only when all signed archives are ready
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft > /tmp/existing.json 2>/dev/null; then
            node -e "if(!require('/tmp/existing.json').isDraft) throw new Error('Refusing to overwrite public release')"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --clobber
          gh release edit "$TAG" --draft=false --latest
          echo "[Public download](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG})" >> "$GITHUB_STEP_SUMMARY"
