<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xóm Nhà Lá — Chuyện gì cũng có tool.</title>
    <style>
      @font-face{font-family:Baloo;src:url('/assets/fonts/baloo2-bold.ttf') format('truetype');font-weight:700;font-display:swap}
      .boot-splash h1{font-family:Baloo,system-ui,sans-serif;font-weight:700}
      html,body{margin:0;background:#101510;color:#e9efdf;font-family:Baloo,system-ui,sans-serif}
      .boot-splash{min-height:100vh;display:grid;place-content:center;text-align:center;overflow:hidden;background:radial-gradient(ellipse at center,#263322 0%,#101510 65%)}
      .boot-seal{position:relative;width:320px;height:320px;margin:0 auto 24px;display:grid;place-items:center}
      .boot-seal:before,.boot-seal:after{content:"";position:absolute;inset:0;border:1px solid #b7d79130;border-radius:50%}
      .boot-seal:before{border-top:3px solid #c4df9b;animation:boot-spin 2s linear infinite}
      .boot-seal:after{inset:14px;border-bottom:2px solid #a1c580;animation:boot-spin 3s linear infinite reverse}
      .boot-seal img{position:relative;width:250px;height:274px;object-fit:contain;filter:drop-shadow(0 10px 20px #0006)}
      .boot-kicker{font-size:11px;letter-spacing:.28em;color:#b6ca9e;text-transform:uppercase}
      .boot-splash h1{font-size:54px;margin:0 0 24px;letter-spacing:0;color:#c4df9b}
      .boot-splash p{font-size:20px;color:#c1cbb8;margin:4px 0}
      .boot-status{margin-top:14px!important;font-size:18px!important;color:#c8dbb4!important}
      .boot-dots{display:flex;justify-content:center;gap:6px;margin-top:14px}.boot-dots i{width:5px;height:5px;background:#c4df9b;border-radius:50%;animation:boot-pulse 1.2s ease-in-out infinite}.boot-dots i:nth-child(2){animation-delay:.2s}.boot-dots i:nth-child(3){animation-delay:.4s}
      @keyframes boot-spin{to{transform:rotate(360deg)}}@keyframes boot-pulse{50%{opacity:.2;transform:scale(.7)}}
      @media(prefers-reduced-motion:reduce){.boot-seal:before,.boot-seal:after,.boot-dots i{animation:none}}
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-splash" role="status" aria-live="polite"><h1>Xóm Nhà Lá</h1><div class="boot-seal"><img src="/assets/icon-mascot-transparent.png" alt="Chủ xóm"></div><p>Xóm không ngại việc khó, chỉ ngại làm bằng tay.</p><p class="boot-status">Bà cô đang mở cửa xóm, đợi xíu...</p><div class="boot-dots" aria-hidden="true"><i></i><i></i><i></i></div></div></div>
    <script type="module" src="/src/renderer.js"></script>
  </body>
</html>
